<app-campo />

<header class="top">
  <div class="wrap bar">
    <a [routerLink]="i18n.base() || '/'" class="brand">javoscript<span>.cl</span></a>

    <nav class="acciones">
      <!-- Enlace real, no un boton: funciona sin JS y el crawler lo sigue
           hasta la otra version del sitio. -->
      <a class="idioma" [routerLink]="i18n.urlOtroIdioma()" [attr.hreflang]="i18n.otro()">
        {{ i18n.otro() === 'en' ? 'EN' : 'ES' }}
      </a>
      <button
        type="button"
        class="tema"
        (click)="temas.siguiente()"
        [attr.aria-label]="etiquetaTema()"
        [attr.title]="etiquetaTema()"
      >{{ glifo() }}</button>

      <a class="mail" [href]="'mailto:' + perfil().email">{{ ui().escribeme }}</a>
    </nav>
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer class="foot">
  <div class="wrap">
    <span class="label">{{ perfil().nombre }} · {{ perfil().ubicacion }}</span>
    <span class="label">
      <a [href]="'mailto:' + perfil().email">{{ ui().correo }}</a>
      <a [href]="perfil().linkedin" rel="noopener">LinkedIn</a>
      <a [href]="perfil().github" rel="noopener">GitHub</a>
    </span>
  </div>
</footer>

<app-campo />

<header class="top">
  <div class="wrap bar">
    <a [routerLink]="i18n.base() || '/'" class="brand">javoscript<span>.cl</span></a>

    <nav class="acciones">
      <!-- Enlace real, no un boton: funciona sin JS y el crawler lo sigue
           hasta la otra version del sitio. -->
      <a class="idioma" [routerLink]="i18n.urlOtroIdioma()" [attr.hreflang]="i18n.otro()">
        {{ i18n.otro() === 'en' ? 'EN' : 'ES' }}
      </a>
      <button
        type="button"
        class="tema"
        role="switch"
        [attr.aria-checked]="temas.esOscuro()"
        (click)="temas.alternar()"
        [attr.aria-label]="etiquetaTema()"
        [attr.title]="etiquetaTema()"
      >
        <svg class="icono sol" viewBox="0 0 16 16" aria-hidden="true">
          <circle cx="8" cy="8" r="3.1" />
          <g stroke-linecap="round">
            <path d="M8 1.2v1.6M8 13.2v1.6M1.2 8h1.6M13.2 8h1.6" />
            <path d="M3.2 3.2l1.1 1.1M11.7 11.7l1.1 1.1M12.8 3.2l-1.1 1.1M4.3 11.7l-1.1 1.1" />
          </g>
        </svg>
        <svg class="icono luna" viewBox="0 0 16 16" aria-hidden="true">
          <path d="M13.2 10.1A5.6 5.6 0 0 1 6 2.8a5.6 5.6 0 1 0 7.2 7.3z" />
        </svg>
        <span class="perilla" aria-hidden="true"></span>
      </button>

      <a class="mail" [href]="'mailto:' + perfil().email">{{ ui().escribeme }}</a>
    </nav>
  </div>
</header>

<main>
  <router-outlet />
</main>

<footer class="foot">
  <div class="wrap">
    <span class="label">{{ perfil().nombre }} · {{ perfil().ubicacion }}</span>
    <span class="label">
      <a [href]="'mailto:' + perfil().email">{{ ui().correo }}</a>
      <a [href]="perfil().linkedin" rel="noopener">LinkedIn</a>
      <a [href]="perfil().github" rel="noopener">GitHub</a>
    </span>
  </div>
</footer>
